<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TotalCareEngineering</title>
    <base href="/TotalCareWeb/" /> <!-- ✅ Use "/TotalCareWeb/" if no custom domain -->
    <!--<base href="/" />--> <!-- ✅ Use "/" if custom domain -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TotalCareEngineering.styles.css" rel="stylesheet" />
    <!--<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>

    <style>
        /* ── Loading Screen ── */
        #tc-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

            /* Dot grid texture */
            #tc-loader::before {
                content: '';
                position: absolute;
                inset: 0;
                background-image: radial-gradient(circle, rgba(236,124,38,0.06) 1px, transparent 1px);
                background-size: 36px 36px;
                pointer-events: none;
            }

            /* Ambient glow */
            #tc-loader::after {
                content: '';
                position: absolute;
                width: clamp(260px, 55vw, 440px);
                height: clamp(260px, 55vw, 440px);
                background: radial-gradient(circle, rgba(236,124,38,0.12) 0%, transparent 70%);
                border-radius: 50%;
                pointer-events: none;
                animation: glowPulse 3s ease-in-out infinite;
            }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.5;
                transform: scale(0.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* ── Logo ── */
        #tc-loader__logo {
            position: relative;
            z-index: 2;
            width: clamp(140px, 38vw, 240px);
            height: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
            filter: drop-shadow(0 8px 32px rgba(236,124,38,0.25));
        }

        /* ── Divider ── */
        #tc-loader__divider {
            position: relative;
            z-index: 2;
            width: 0;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #EC7C26, transparent);
            margin: clamp(16px, 3vw, 24px) 0 clamp(12px, 2.5vw, 20px);
            animation: expandLine 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
        }

        @keyframes expandLine {
            to {
                width: clamp(140px, 32vw, 200px);
            }
        }

        /* ── Tagline container ── */
        #tc-loader__tagline {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 14px);
        }

            /* All word spans share base style */
            #tc-loader__tagline .tc-word {
                font-family: 'Trebuchet MS', 'Gill Sans', sans-serif;
                font-size: clamp(0.65rem, 2.2vw, 0.85rem);
                font-weight: 700;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: #FFFFFF;
                opacity: 0;
                transform: translateY(8px);
            }

        /* Each word animates in with a stagger */
        #tc-word-1 {
            animation: fadeUp 0.6s ease 1.6s forwards;
        }

        #tc-word-2 {
            animation: fadeUp 0.6s ease 1.9s forwards;
        }

        #tc-word-3 {
            color: #EC7C26;
            animation: fadeUp 0.6s ease 2.2s forwards;
        }

        /* Dot separators */
        #tc-loader__tagline .tc-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #EC7C26;
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0);
        }

        #tc-dot-1 {
            animation: dotPop 0.35s ease 1.78s forwards;
        }

        #tc-dot-2 {
            animation: dotPop 0.35s ease 2.08s forwards;
        }

        @keyframes dotPop {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ── Progress bar ── */
        #tc-loader__bar-wrap {
            position: relative;
            z-index: 2;
            margin-top: clamp(30px, 5vw, 46px);
            width: clamp(140px, 32vw, 200px);
            height: 2px;
            background: rgba(255,255,255,0.10);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease 2.4s forwards;
        }

        #tc-loader__bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #EC7C26, #f5a05a);
            border-radius: 2px;
            animation: loadBar 12s cubic-bezier(0.05, 0.6, 0.4, 1) 2.5s forwards;
        }

        @keyframes loadBar {
            0% {
                width: 0%;
            }

            30% {
                width: 40%;
            }

            60% {
                width: 68%;
            }

            85% {
                width: 85%;
            }

            100% {
                width: 97%;
            }
            /* holds just below 100% until Blazor fires */
        }

        /* ── Fade out ── */
        #tc-loader.tc-loader--done {
            animation: loaderOut 0.6s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        @keyframes loaderOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }

        /* ── Shared keyframes ── */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Hide default Blazor spinner */
        .loading-progress,
        .loading-progress-text {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- ── Branded Loader ── -->
    <div id="tc-loader">
        <img id="tc-loader__logo" src="images/TotalCare.png" alt="TotalCare Engineering Services" />
        <div id="tc-loader__divider"></div>

        <div id="tc-loader__tagline">
            <span id="tc-word-1" class="tc-word">Precision</span>
            <div id="tc-dot-1" class="tc-dot"></div>
            <span id="tc-word-2" class="tc-word">Reliability</span>
            <div id="tc-dot-2" class="tc-dot"></div>
            <span id="tc-word-3" class="tc-word">TotalCare.</span>
        </div>

        <div id="tc-loader__bar-wrap">
            <div id="tc-loader__bar"></div>
        </div>
    </div>

    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        (function () {
            const loader = document.getElementById('tc-loader');
            if (!loader) return;

            function dismiss() {
                if (!document.getElementById('tc-loader')) return;
                // Complete the progress bar instantly before fading
                const bar = document.getElementById('tc-loader__bar');
                if (bar) bar.style.width = '100%';
                setTimeout(() => {
                    loader.classList.add('tc-loader--done');
                    setTimeout(() => loader.remove(), 6000);
                }, 15000);
            }

            // Watch for Blazor replacing #app content
            const appEl = document.getElementById('app');
            if (appEl) {
                const obs = new MutationObserver(() => {
                    const first = appEl.firstElementChild;
                    if (appEl.children.length > 1 || (first && first.tagName !== 'SVG')) {
                        obs.disconnect();
                        dismiss();
                    }
                });
                obs.observe(appEl, { childList: true, subtree: false });
            }

            // Fallback safety net
            setTimeout(dismiss, 15000);
        })();
    </script>
</body>

</html>
